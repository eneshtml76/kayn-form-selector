<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayn Form Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="wrapper">
        
        <h1 id="main-title">Choose Your Destiny: Shadow or Darkin?</h1>
        
        <img id="kayn-img" src="wallpaperflare.com_wallpaper.jpg" alt="Kayn" width="400">

        <div class="button-group">
            <button class="btn blue-btn" onclick="shadowForm()">Shadow Assassin (Blue)</button>
            <button class="btn red-btn" onclick="darkinForm()">Darkin Rhaast (Red)</button>
        </div>

        <!-- Skills Display Box -->
        <div id="skills-container" class="skills-box">
            <p>Select a form to unlock Champion Skills...</p>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
